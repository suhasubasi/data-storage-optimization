name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/python/pyproject.toml

      - name: Install contract checker
        run: pip install -e contracts/python jsonschema pyyaml openapi-spec-validator

      - name: Check contracts
        run: python contracts/scripts/check_contracts.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            contracts/python/pyproject.toml

      - name: Install backend
        run: pip install -r backend/requirements.txt -e contracts/python

      - name: Run tests
        working-directory: backend
        run: python -m pytest -ra --tb=short

  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/pyproject.toml
            contracts/python/pyproject.toml

      - name: Install pipeline
        run: pip install -r pipeline/requirements.txt -e contracts/python -e pipeline

      - name: Run tests
        working-directory: pipeline
        # The real Whisper test is skipped unless the model is already cached.
        # CI does not download that model.
        run: python -m pytest -ra --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
