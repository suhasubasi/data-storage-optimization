[project]
name = "dso-contracts"
version = "1.0.0"
description = "FROZEN shared Pydantic models generated from contracts/schemas (Ericsson DSO MVP). Do not edit models.py by hand."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dso_contracts"]
